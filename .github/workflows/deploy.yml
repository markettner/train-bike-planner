name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

  # Re-deploy automatically when the data-update workflow pushes new data files
  workflow_run:
    workflows: ["Update Station Data"]
    types:
      - completed

  # Allow manual re-deploy from the Actions tab
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments: queue overlapping runs instead of cancelling them.
# `push` (human commits) and `workflow_run` (the data-update bot's commits,
# which don't fire `push` because they use GITHUB_TOKEN) can both trigger a
# deploy close together. With cancel-in-progress, the loser was cancelled
# mid-publish and surfaced as a failure — sometimes leaving stale content
# live. Queueing lets the in-flight deploy finish and the latest commit
# deploy next; GitHub keeps only the newest pending run, so it never stacks.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
